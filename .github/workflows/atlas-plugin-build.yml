name: ATLAS Plugin Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-plugin-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show CMake version
        run: cmake --version
      - name: Configure
        run: cmake --preset windows-x64-release
      - name: Build
        run: cmake --build --preset windows-x64-release
      - name: Run portable contract tests
        run: ctest --test-dir build/windows-x64-release -C Release --output-on-failure
